<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}Suivi du matériel{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1><a href="{{ url_for('index') }}">Suivi du matériel</a></h1>
    <nav>
      <a href="{{ url_for('index') }}">Inventaire</a>
      <a href="{{ url_for('mouvements') }}">Entrées / Sorties</a>
      <a class="bouton" href="{{ url_for('ajouter_materiel') }}">Ajouter du matériel</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for categorie, message in messages %}
          <div class="flash {{ categorie }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block contenu %}{% endblock %}
  </main>
</body>
</html>
